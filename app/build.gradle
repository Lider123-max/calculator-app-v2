plugins {
    id 'com.android.application' version '8.1.0'
}
android {
    namespace 'com.abdulkarim.calculator'
    compileSdk 34

    defaultConfig {
        applicationId "com.abdulkarim.calculator"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
